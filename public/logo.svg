<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mark -->
  <g transform="translate(0, 4)">
    <!-- Outer ring -->
    <circle cx="20" cy="20" r="19" stroke="#372308" stroke-width="1.5" fill="none" opacity="0.25"/>
    <!-- Inner ring -->
    <circle cx="20" cy="20" r="15.5" stroke="#372308" stroke-width="0.75" fill="none" opacity="0.15"/>
    <!-- D letterform -->
    <path d="M13.5 11.5 H18.8 C23.6 11.5 27.5 14.9 27.5 20 C27.5 25.1 23.6 28.5 18.8 28.5 H13.5 Z" fill="#372308"/>
    <!-- D inner cutout -->
    <path d="M15.8 13.8 H18.5 C22.0 13.8 25.0 16.4 25.0 20.0 C25.0 23.6 22.0 26.2 18.5 26.2 H15.8 Z" fill="#F5F0E8"/>
    <!-- D spine -->
    <rect x="13.5" y="11.5" width="2.3" height="17" fill="#372308"/>
    <!-- Serifs -->
    <rect x="12.2" y="11.5" width="4.5" height="1.2" fill="#372308"/>
    <rect x="12.2" y="27.3" width="4.5" height="1.2" fill="#372308"/>
    <!-- Gold accent dots -->
    <circle cx="20" cy="5" r="1.5" fill="#F0D5A0"/>
    <circle cx="20" cy="35" r="1.5" fill="#F0D5A0"/>
    <circle cx="5" cy="20" r="1" fill="#F0D5A0" opacity="0.6"/>
    <circle cx="35" cy="20" r="1" fill="#F0D5A0" opacity="0.6"/>
  </g>
  <!-- Wordmark -->
  <text
    x="52"
    y="30"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-weight="700"
    letter-spacing="3"
    fill="#372308"
    text-anchor="start"
    dominant-baseline="middle"
  >DOMAINE</text>
  <!-- Thin rule under wordmark -->
  <line x1="52" y1="37" x2="200" y2="37" stroke="#F0D5A0" stroke-width="1"/>
</svg>
